<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>طلب الالتحاق — مدرسة سيد الأوصياء الدينية</title>
<meta name="description" content="استمارة طلب الالتحاق بالدراسة الحوزوية في مدرسة سيد الأوصياء الدينية — النجف الأشرف.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230E4D45'/%3E%3Cpath d='M16 6c3.6 2.4 5.4 5.6 5.4 9.2 0 3.6-2.4 6.6-5.4 8.8-3-2.2-5.4-5.2-5.4-8.8C10.6 11.6 12.4 8.4 16 6z' fill='%23C9A227'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css?v=2">
<link rel="stylesheet" href="../assets/apply.css?v=2">
</head>
<body class="apply-page">

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="../">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="40" height="40"><circle cx="20" cy="20" r="19" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".45"/><path d="M20 7c4.6 3.1 6.9 7.2 6.9 11.8S23.8 27.3 20 30.4c-3.8-3.1-6.9-6.9-6.9-11.6S15.4 10.1 20 7z" fill="currentColor"/><circle cx="20" cy="18" r="2.6" fill="var(--paper)"/></svg>
      </span>
      <span class="brand-text">
        <strong data-t="brand">مدرسة سيد الأوصياء الدينية</strong>
        <small data-t="brandSub">النجف الأشرف</small>
      </span>
    </a>
    <div class="header-actions">
      <a class="back-link" href="../" data-t="backHome">العودة إلى الصفحة الرئيسية</a>
      <button id="langToggle" class="lang-toggle" type="button">English</button>
    </div>
  </div>
</header>

<main class="wrap apply-wrap">

  <!-- Intro, shown before the form starts -->
  <section class="apply-intro" id="intro">
    <h1 data-t="pageTitle">طلب الالتحاق بالدراسة الحوزوية</h1>
    <p class="lede" data-t="pageLede"></p>
    <div class="prepare">
      <h2 data-t="prepareTitle">جهّز قبل البدء</h2>
      <ul>
        <li data-t="prepare1"></li>
        <li data-t="prepare2"></li>
        <li data-t="prepare3"></li>
        <li data-t="prepare4"></li>
      </ul>
    </div>
  </section>

  <!-- Progress -->
  <nav class="progress" id="progress" aria-label="Progress" hidden>
    <ol id="progressSteps"></ol>
    <p class="progress-label"><span id="stepLabel"></span></p>
    <div class="progress-bar"><div id="progressFill"></div></div>
  </nav>

  <form id="applyForm" novalidate autocomplete="on">
    <!-- Bots fill every field they can see; this one is hidden from people. -->
    <div class="honeypot" aria-hidden="true">
      <label>Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label>
    </div>

    <div id="steps"></div>

    <p class="form-status" id="formStatus" role="alert" aria-live="assertive"></p>

    <div class="form-nav">
      <button type="button" class="btn btn-ghost" id="prevBtn" data-t="prev">السابق</button>
      <button type="button" class="btn btn-primary" id="nextBtn" data-t="next">التالي</button>
      <button type="submit" class="btn btn-primary" id="submitBtn" hidden data-t="submit">إرسال الطلب</button>
    </div>

    <p class="draft-row">
      <span class="draft-saved" id="draftSaved" hidden data-t="saved"></span>
      <button type="button" class="linkish" id="clearDraft" data-t="clearDraft"></button>
    </p>
  </form>

  <section class="success-card" id="successCard" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
    <h2 data-t="successTitle"></h2>
    <p data-t="successBody"></p>
    <p class="reference" id="successRef"></p>
    <p class="fine" data-t="successNote"></p>
    <button type="button" class="btn btn-ghost" onclick="window.print()" data-t="print"></button>
  </section>

  <p class="load-error" id="loadError" hidden></p>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p><strong data-t="brand"></strong> — <span data-t="brandSub"></span></p>
  </div>
</footer>

<script src="../assets/apply-i18n.js?v=2"></script>
<script src="../assets/apply.js?v=2"></script>
</body>
</html>
